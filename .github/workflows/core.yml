name: kwik-e-gate core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: ruff check .
      - run: pytest

  full-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - run: python -m pip install -e '.[test]' pygate-ci==0.3.2
      - run: npm ci --ignore-scripts
      - name: Check both runtimes and real adapters
        id: gate
        uses: ./.github/actions/kwik-e-gate
        env:
          KWIK_QUICK_GATE_CLI: ${{ github.workspace }}/src/cli.js
          KWIK_PYGATE_CLI: pygate
        with:
          mode: full
          base: ${{ github.event.pull_request.base.sha || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kwik-e-gate-full-receipt
          path: ${{ steps.gate.outputs.receipt-path }}
          if-no-files-found: error
