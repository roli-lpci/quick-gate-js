name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)publish, e.g. v0.3.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          tag_ref="${{ inputs.tag || github.ref_name }}"
          tag_version="${tag_ref#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

      - name: Upload package tarball
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/quick-gate
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to a trusted-publishing-capable version
        run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish ./*.tgz --provenance --access public
